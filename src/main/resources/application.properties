server.port=0

# ---- 本地任务引擎配置 ----
# 工作线程数（虚拟线程开关开启时此项为提交给虚拟线程执行器的 worker 循环数）
task.engine.worker-threads=4
# 有界队列容量，超过容量按 reject-policy 处理
task.engine.queue-capacity=200
# 背压拒绝策略：ABORT(立即拒绝,HTTP 429) | CALLER_RUNS(提交线程自己执行,天然降速) | BLOCK(阻塞等待空位)
task.engine.reject-policy=ABORT
# 单次执行默认超时 / 任务整体默认截止时间（含所有重试与退避）
task.engine.default-timeout=5s
task.engine.default-deadline=30s
# 优先级老化步进：队列中每等待该毫秒数晋升一级，保证普通任务不会被高优先级无限饿死
task.engine.aging-millis=200
# 是否使用虚拟线程作为工作线程
task.engine.use-virtual-threads=false
# 每种任务类型的最大并发（隔离舱）
task.engine.default-bulkhead=2
# 熔断：失败时间窗内达到失败阈值则该类型熔断 OPEN，经过 open-duration 后半开探测
task.engine.failure-threshold=5
task.engine.failure-window=10s
task.engine.open-duration=2s
# 重试：总尝试次数（含首次）、初始退避、退避倍率、退避上限
task.engine.retry.max-attempts=3
task.engine.retry.backoff=50ms
task.engine.retry.backoff-multiplier=2.0
task.engine.retry.max-backoff=1s
# 终态结果保留条数（超出后淘汰最旧结果，避免内存无限增长）
task.engine.completed-retention=10000

logging.level.com.github.lisama569=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
