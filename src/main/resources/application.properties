server.port=0
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.github.lisama569=INFO

# ===== 本地任务引擎配置 =====
# 引擎总开关
task-engine.enabled=true
# NORMAL 任务等待超过该毫秒数后提升为 HIGH 参与调度（防饿死的确定上界）
task-engine.aging-threshold-millis=2000
# 状态/结果存储容量上限（只淘汰终态条目，活跃任务永不淘汰）
task-engine.result-store-max-entries=50000
# 终态结果保留时长（毫秒），过期由后台扫描清理
task-engine.result-ttl-millis=120000
# 提交参数缺省值（可被单次提交覆盖）
task-engine.default-timeout-millis=5000
task-engine.default-deadline-millis=30000
task-engine.default-max-attempts=1
task-engine.default-retry-backoff-millis=100
# 每种任务类型独立流水线：独立有界队列 + 独立 worker 组（故障隔离）
task-engine.types.echo.queue-capacity=200
task-engine.types.echo.workers=4
task-engine.types.slow.queue-capacity=100
task-engine.types.slow.workers=2
task-engine.types.flaky.queue-capacity=100
task-engine.types.flaky.workers=2
task-engine.types.alwaysFail.queue-capacity=100
task-engine.types.alwaysFail.workers=2
